version: '3.8'

services:
  app:
    image: ddd:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/tms
      SPRING_DATASOURCE_USERNAME: student
      SPRING_DATASOURCE_PASSWORD: chocolatefrog
      SPRING_PROFILES_ACTIVE: prod # Профиль для работы с основной базой данных

  test-app:
    image: ddd:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://test-db:5432/tmstest
      SPRING_DATASOURCE_USERNAME: student
      SPRING_DATASOURCE_PASSWORD: chocolatefrog
      SPRING_PROFILES_ACTIVE: test # Профиль для работы с тестовой базой данных

  db:
    image: postgres:latest
    environment:
      POSTGRES_DB: tms
      POSTGRES_USER: student
      POSTGRES_PASSWORD: chocolatefrog
    ports:
      - "5432:5432"

  test-db:
    image: postgres:latest
    environment:
      POSTGRES_DB: tmstest
      POSTGRES_USER: student
      POSTGRES_PASSWORD: chocolatefrog
    ports:
      - "5433:5432" # Используем другой порт для тестовой базы данных

networks:
  default:
    driver: bridge